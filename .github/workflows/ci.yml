name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install DCMTK & system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dcmtk libgl1 libglib2.0-0 curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python AST compilation
        run: |
          python -m py_compile app/main.py app/config.py app/models/*.py app/services/*.py app/routers/*.py

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t dicom-converter-api:test .

      - name: Test Docker image health
        run: |
          docker run -d --name dicom-converter-api-test -p 8080:8080 dicom-converter-api:test
          sleep 5
          curl -f http://localhost:8080/health || exit 1
          docker stop dicom-converter-api-test
          docker rm dicom-converter-api-test
